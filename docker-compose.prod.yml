# Production stack — immutable images from GHCR behind YOUR reverse proxy.
#
# Usage (on the server):
#   1. Create an env file (never commit it):  see ".env.example" → production block
#   2. docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#   3. Point your reverse proxy (Caddy / Traefik / Nginx Proxy Manager / …) at
#      http://127.0.0.1:${WEB_PORT} and terminate TLS there. Forward
#      X-Forwarded-For / X-Forwarded-Proto. The port binds to localhost by
#      default; set WEB_BIND_ADDRESS if the proxy runs elsewhere.
#
# Design (docs/DEPLOYMENT.md):
#   - The ONLY exposed port is the web container's HTTP port. The SPA and the
#     API share one origin: nginx serves the bundle and proxies /api/* to the
#     api service, so auth cookies stay first-party and no URLs are baked in.
#   - Postgres is reachable only on the internal network — no host port.
#   - `migrate` applies pending Prisma migrations and exits; the API starts
#     only after it succeeds. Images are pinned by tag: deploy = change
#     IMAGE_TAG, `docker compose … pull && up -d`.

name: workhub

# Bounded container logs: Docker's json-file driver otherwise grows forever
# and can fill the disk. 5 × 10 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}'
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: '${IMAGE_BASE:-ghcr.io/huttonhomehub/workhub}/api:${IMAGE_TAG:?pin IMAGE_TAG to a released version}'
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    restart: 'no'
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app}?schema=public

  api:
    image: ${IMAGE_BASE:-ghcr.io/huttonhomehub/workhub}/api:${IMAGE_TAG}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app}?schema=public
      API_PORT: 3000
      # Same-origin deployment: the public origin is the only trusted origin.
      CORS_ORIGINS: '${APP_ORIGIN:?set APP_ORIGIN, e.g. https://app.example.com}'
      BETTER_AUTH_SECRET: '${BETTER_AUTH_SECRET:?generate one with openssl rand -base64 32}'
      BETTER_AUTH_URL: ${APP_ORIGIN}
      # Hops to skip in X-Forwarded-For so auth rate limits are per client.
      # Default covers Docker networks (web nginx, a proxy on this host); add
      # your reverse proxy's address if it runs elsewhere.
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-172.16.0.0/12}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  web:
    image: ${IMAGE_BASE:-ghcr.io/huttonhomehub/workhub}/web:${IMAGE_TAG}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    environment:
      API_UPSTREAM: api:3000
    ports:
      # The single exposed port — point your reverse proxy here. Docker's
      # published ports bypass host firewalls (ufw/firewalld), so bind to
      # localhost unless the proxy must reach it from elsewhere
      # (WEB_BIND_ADDRESS, docs/DEPLOYMENT.md).
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080'

volumes:
  db-data:
    # Pinned so the data never depends on the compose project name. NEVER rename
    # this without migrating the data first — a new name starts an EMPTY
    # database and the app boots against it without complaint.
    name: workhub-db-data

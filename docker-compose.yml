# Local development stack for the app.
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# This compose file is intended for LOCAL DEVELOPMENT ONLY: it builds images
# from the working tree and exposes Postgres on the host. Production runs the
# immutable GHCR images via docker-compose.prod.yml (see docs/DEPLOYMENT.md).
#
# Everything is served through the web container on http://localhost:8080 —
# the SPA and the API share one origin (nginx proxies /api/* to the api
# service), exactly as in production.

name: blank-app

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies pending Prisma migrations, then exits. The api service
  # waits for it, so a fresh `docker compose up` always has the schema.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}?schema=public

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}?schema=public
      API_PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-dev-only-secret-change-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      # Skip the web nginx hop in X-Forwarded-For (per-client auth rate limits).
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-172.16.0.0/12}
    ports:
      - '3000:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_UPSTREAM: api:3000
    ports:
      - '8080:8080'

volumes:
  db-data:

name: Publish container images

# Three ways in (see docs/RELEASING.md):
#   - workflow_call from the Release workflow, with the released `version`:
#     builds both images. This is the normal release path — Changesets pushes
#     the `@repo/api@X.Y.Z` / `@repo/web@X.Y.Z` tags with GITHUB_TOKEN, and
#     GitHub never starts workflows from GITHUB_TOKEN events, so the tag push
#     below does NOT fire for those tags.
#   - push of a release tag by a person: builds only the app the tag names.
#   - workflow_dispatch: builds both images, tagged by commit sha only.
# The apps are versioned together (`fixed` in .changeset/config.json), so one
# release produces matching `api` and `web` versions for
# docker-compose.prod.yml's single IMAGE_TAG.
on:
  workflow_call:
    inputs:
      version:
        description: Released version (X.Y.Z) to tag both images with.
        required: true
        type: string
  push:
    tags: ['@repo/api@*', '@repo/web@*']
  workflow_dispatch:

# A release build must never be cancelled by a later manual run.
concurrency:
  group: docker-${{ inputs.version || github.ref }}
  cancel-in-progress: ${{ !inputs.version }}

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & push ${{ matrix.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
    steps:
      # A called run uses its version input; a tag push builds only the app it
      # names; a manual run builds both (tagged by commit sha only).
      - name: Resolve version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PREFIX: '@repo/${{ matrix.app }}@'
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "Invalid version input: $INPUT_VERSION" >&2
              exit 1
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          elif [ "$REF_TYPE" != "tag" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          elif [ "${REF_NAME#"$PREFIX"}" != "$REF_NAME" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "version=${REF_NAME#"$PREFIX"}" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Tag $REF_NAME is not a ${{ matrix.app }} release; skipping."
          fi

      - uses: actions/checkout@v7
        if: steps.release.outputs.build == 'true'

      - name: Set up Docker Buildx
        if: steps.release.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.release.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=sha

      - name: Build and push
        if: steps.release.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version & release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags/releases and push version commits
      pull-requests: write # open/update the "Version Packages" PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Changesets either opens/updates a release PR that bumps versions and
      # updates CHANGELOG.md, or — when such a PR is merged — publishes the
      # release: our packages are private, so "publish" only creates the
      # vX.Y.Z git tags that trigger the image workflow. See docs/DEPLOYMENT.md.
      # Needs the repo setting "Allow GitHub Actions to create and approve pull
      # requests" (Settings → Actions → General).
      - name: Create release pull request or publish
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'

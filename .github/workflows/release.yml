name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version & release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags/releases and push version commits
      pull-requests: write # open/update the "Version Packages" PR
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Changesets either opens/updates a release PR that bumps versions and
      # updates CHANGELOG.md, or — when such a PR is merged — publishes the
      # release: our packages are private, so "publish" only creates the
      # `@repo/api@X.Y.Z` / `@repo/web@X.Y.Z` git tags. See docs/DEPLOYMENT.md.
      # Needs the repo setting "Allow GitHub Actions to create and approve pull
      # requests" (Settings → Actions → General).
      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'

      # api, web, and types share one version (`fixed` in
      # .changeset/config.json), so the api entry names the release.
      - name: Resolve the released version
        id: version
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          version=$(node -e '
            const released = JSON.parse(process.env.PUBLISHED_PACKAGES);
            const api = released.find((pkg) => pkg.name === "@repo/api");
            if (!api) {
              console.error("@repo/api was not released: " + process.env.PUBLISHED_PACKAGES);
              process.exit(1);
            }
            console.log(api.version);
          ')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Tags pushed with GITHUB_TOKEN don't start other workflows, so the release
  # calls the image workflow directly instead of relying on its tag trigger.
  publish-images:
    name: Publish container images
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release.outputs.version }}

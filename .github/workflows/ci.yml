name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Format, lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @repo/api prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # The committed OpenAPI contract and the client types generated from it
      # must match the code (ADR-0017). Run `pnpm contract:generate` to fix.
      - name: Check the API contract is up to date
        run: |
          pnpm contract:generate
          git diff --exit-code -- apps/api/openapi.json packages/types/src/openapi.gen.ts

  template:
    name: Verify feature template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate a feature from the canonical reference template with
      # `pnpm gen:feature`, then type-check, lint, and unit-test it, so neither
      # the template nor the generator can silently rot (ADR-0015).
      - name: Verify reference template
        run: bash scripts/verify-template.sh

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # A disposable PostgreSQL for API end-to-end tests (Supertest).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test?schema=public
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @repo/api prisma:generate

      - name: Apply database migrations
        run: pnpm --filter @repo/api prisma:deploy

      # CI runs the chromium project only (see playwright.config.ts).
      - name: Install Playwright browsers
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      # Runs after the suites above: it pushes a throwaway table into this
      # disposable database and drops it again when done.
      - name: Run the generated feature's API e2e tests
        run: bash scripts/verify-template.sh --e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

# pnpm workspace definition for the WorkHub monorepo.
# Docs: https://pnpm.io/workspaces
packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies allowed to run install scripts (pnpm 10 blocks the rest). These
# need them: Prisma downloads its engines, esbuild and @swc/core fetch native
# binaries. Settings live here, not in package.json's "pnpm" field, which newer
# pnpm versions no longer read. Docs: https://pnpm.io/settings
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma
# Deliberately not built: swagger-ui-dist's usage-telemetry postinstall.
ignoredBuiltDependencies:
  - '@scarf/scarf'

# Pin the catalog of shared dependency versions so every workspace
# package resolves the same version of a given library. Reference these
# from a package.json with e.g. "react": "catalog:".
catalog:
  # Frontend
  react: ^19.3.0
  react-dom: ^19.3.0
  # Tooling / language
  typescript: ^5.7.3
  # Testing
  vitest: ^5.0.0
  '@playwright/test': ^1.63.0
  supertest: ^7.0.0
